<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">李子龙 · AI 产品经理</title>
  <desc id="desc">理解真实需求，设计有效体验。从前端开发走向 AI 产品。文字缓缓出现，右侧浅灰像素消散，播放一次后静止。</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .enter{animation:enter 1.4s cubic-bezier(.22,1,.36,1) both}
    .line-two{animation-delay:.25s}.caption{animation-delay:.5s}
    .pixel{animation:dissolve 2.4s ease-in-out both}
    .p1{animation-delay:.5s}.p2{animation-delay:.8s}.p3{animation-delay:1.1s}.p4{animation-delay:1.4s}
    @keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes dissolve{from{opacity:1}to{opacity:0}}
    @media(prefers-reduced-motion:reduce){.enter{animation:none}.pixel{animation:none;opacity:0}}
  </style>
  <rect x="1" y="1" width="998" height="358" rx="12" fill="#f6f6f5" stroke="#e4e4e3"/>
  <path d="M1 57H999" stroke="#e4e4e3"/>
  <rect x="32" y="23" width="13" height="13" rx="1" fill="#686868"/>
  <text x="59" y="36" font-size="16" fill="#626262">李子龙 <tspan fill="#b3b3b3">/</tspan> 个人空间</text>
  <text x="964" y="36" text-anchor="end" font-size="13" letter-spacing="2" fill="#858585">PRODUCT · CODE · CURIOSITY</text>
  <text x="40" y="104" font-size="16" fill="#777">AI 产品经理 · 前端开发背景</text>
  <g class="enter"><text x="38" y="166" font-size="46" font-weight="600" letter-spacing="1" fill="#292929">理解真实需求，</text></g>
  <g class="enter line-two"><text x="38" y="226" font-size="46" font-weight="600" letter-spacing="1" fill="#292929">设计有效体验。</text></g>
  <g class="enter caption"><text x="40" y="269" font-size="17" fill="#737373">把产品思考、原型与代码连接起来。</text></g>
  <!-- A quiet, permanent pixel structure remains after the one-time dissolve. -->
  <g fill="#d3d3d1">
    <rect x="728" y="133" width="20" height="20"/><rect x="752" y="133" width="20" height="20"/>
    <rect x="728" y="157" width="20" height="20"/><rect x="752" y="157" width="20" height="20"/>
    <rect x="776" y="157" width="20" height="20" opacity=".85"/><rect x="728" y="181" width="20" height="20" opacity=".85"/>
    <rect x="752" y="181" width="20" height="20" opacity=".75"/><rect x="776" y="181" width="20" height="20" opacity=".55"/>
    <rect x="800" y="181" width="20" height="20" opacity=".35"/><rect x="752" y="205" width="20" height="20" opacity=".5"/>
    <rect x="824" y="133" width="20" height="20" opacity=".45"/><rect x="848" y="157" width="20" height="20" opacity=".3"/>
    <rect x="800" y="229" width="20" height="20" opacity=".3"/><rect x="896" y="205" width="20" height="20" opacity=".3"/>
  </g>
  <g fill="#dcdcd9">
    <g class="pixel p1"><rect x="872" y="109" width="20" height="20"/><rect x="896" y="133" width="20" height="20"/><rect x="920" y="157" width="20" height="20"/><rect x="920" y="229" width="20" height="20"/></g>
    <g class="pixel p2"><rect x="848" y="109" width="20" height="20"/><rect x="872" y="133" width="20" height="20"/><rect x="896" y="157" width="20" height="20"/><rect x="896" y="181" width="20" height="20"/><rect x="872" y="229" width="20" height="20"/></g>
    <g class="pixel p3"><rect x="800" y="133" width="20" height="20"/><rect x="824" y="157" width="20" height="20"/><rect x="848" y="181" width="20" height="20"/><rect x="872" y="205" width="20" height="20"/><rect x="848" y="229" width="20" height="20"/></g>
    <g class="pixel p4"><rect x="776" y="133" width="20" height="20"/><rect x="800" y="157" width="20" height="20"/><rect x="824" y="181" width="20" height="20"/><rect x="800" y="205" width="20" height="20"/><rect x="824" y="229" width="20" height="20"/></g>
  </g>
  <path d="M40 300H960" stroke="#dededc"/>
  <text x="40" y="335" font-size="15" fill="#737373">LI ZILONG</text>
  <text x="960" y="335" text-anchor="end" font-size="16" fill="#454545">探索我的个人网站 ↗</text>
</svg>
